{% macro creature_portrait(visual, size='', uid='portrait') -%}
<div class="creature-portrait {{ size }} {{ visual.species_class }} {{ visual.tone_class }} {{ visual.tone_mode_class }} {{ visual.wings_class }} {{ visual.size_class }} {{ visual.nutrition_class }} {{ visual.feature_classes }}"{% if visual.tone_style %} style="{{ visual.tone_style }}"{% endif %}>
  <svg class="creature-svg" viewBox="-18 -14 296 188" role="img" aria-hidden="true" style="--portrait-body-fill:url(#bodyTone-{{ uid }});--portrait-shade-fill:url(#creatureShade-{{ uid }});--portrait-wing-fill:url(#wingTone-{{ uid }});">
    <defs>
      <radialGradient id="portraitGlow-{{ uid }}" cx="50%" cy="45%" r="62%">
        <stop offset="0%" stop-color="rgba(255,255,255,.82)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      </radialGradient>
      <linearGradient id="bodyTone-{{ uid }}" x1="12%" y1="18%" x2="88%" y2="84%">
        <stop offset="0%" style="stop-color:var(--creature-tone)"/>
        <stop offset="52%" style="stop-color:var(--creature-tone-secondary,var(--creature-tone))"/>
        <stop offset="100%" style="stop-color:var(--creature-accent-secondary,var(--creature-accent))"/>
      </linearGradient>
      <linearGradient id="creatureShade-{{ uid }}" x1="15%" y1="10%" x2="82%" y2="92%">
        <stop offset="0%" stop-color="rgba(255,255,255,.48)"/>
        <stop offset="100%" stop-color="rgba(24,43,32,.18)"/>
      </linearGradient>
      <linearGradient id="wingTone-{{ uid }}" x1="15%" y1="10%" x2="90%" y2="90%">
        <stop offset="0%" stop-color="rgba(255,255,255,.82)"/>
        <stop offset="100%" style="stop-color:var(--creature-tone-secondary,var(--creature-tone));stop-opacity:.24"/>
      </linearGradient>
      <filter id="portraitShadow-{{ uid }}" x="-18%" y="-22%" width="136%" height="150%">
        <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#26382d" flood-opacity=".2"/>
      </filter>
    </defs>

    <g class="portrait-backdrop">
      <ellipse class="ground" cx="130" cy="82" rx="116" ry="67" style="fill:url(#portraitGlow-{{ uid }})"/>

    <g class="svg-wings">
