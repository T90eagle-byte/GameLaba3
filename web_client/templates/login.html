{% extends "base.html" %}
{% block title %}Вход — БиоСборка{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Вход</h1>
  <form method="post" class="form">
    <label>
      <span>Логин</span>
      <input type="text" name="login" value="{{ login or '' }}" autocomplete="username" required>
    </label>
    <label>
      <span>Пароль</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Войти</button>
  </form>
  <p class="muted">Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
</section>
{% endblock %}
